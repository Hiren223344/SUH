server:
  listen: ":8080"
  max_attempts: 3
  request_budget: 90s
  # Bearer token required to read /internal/stats. Leave unset to disable
  # the endpoint entirely (it refuses all requests rather than defaulting open).
  stats_auth_token: "change-me"

public_models:
  - name: "gpt-router-large"
    upstreams:
      # All five of these route to the same provider, api.kiosapi.com, and
      # currently carry 100% of traffic -- selfhost-pool (see its
      # definition below) is defined but deliberately not referenced here:
      # its base_url points at the same port the router itself listens on
      # by default, so it can never actually be reached until that's fixed
      # (a different port, or a real self-hosted server there). Kept as
      # five separate upstream entries (one per model) rather than one
      # entry, because Stage 1 gating and TPM budgeting are per-model.
      # glm-5.3 is the fallback: among these five it has the widest
      # capability set (text+image, tools, json-schema), so it's the last
      # candidate standing most often when others get gated out.
      - id: qwen3.8-flash
        weight: 0.21
      - id: deepseek-v4-flash
        weight: 0.21
      - id: dots-3-note-preview
        weight: 0.20
      - id: glm-5.3
        weight: 0.20
        fallback: true
      - id: kilo-auto
        weight: 0.18

  # gpt-6-astra and claude-fable-5-1 are additional public-facing names for
  # the exact same real backend pool as gpt-router-large above — NOT
  # distinct upstreams. There is no upstream provider actually serving a
  # model literally named "gpt-6-astra" or "claude-fable-5-1"; those were
  # never real backend identifiers, only the public names a client asks
  # for. Whichever of the three names a client requests, the router fans
  # it out across the same five kiosapi.com-backed models, at the same
  # weights — the identity-opacity chokepoint (see README)
  # means the client never learns that "gpt-6-astra" and
  # "claude-fable-5-1" resolve to the same underlying pool as
  # "gpt-router-large". If these should eventually target a distinct real
  # backend instead, replace this list with a dedicated upstream entry the
  # way gpt-router-large's members are defined below.
  - name: "gpt-6-astra"
    upstreams:
      - id: qwen3.8-flash
        weight: 0.21
      - id: deepseek-v4-flash
        weight: 0.21
      - id: dots-3-note-preview
        weight: 0.20
      - id: glm-5.3
        weight: 0.20
        fallback: true
      - id: kilo-auto
        weight: 0.18

  - name: "claude-fable-5-1"
    upstreams:
      - id: qwen3.8-flash
        weight: 0.21
      - id: deepseek-v4-flash
        weight: 0.21
      - id: dots-3-note-preview
        weight: 0.20
      - id: glm-5.3
        weight: 0.20
        fallback: true
      - id: kilo-auto
        weight: 0.18

upstreams:
  # kiosapi.com-backed models. All share the same base_url and API key —
  # export KIOSAPI_KEY with the key once you have it; nothing else in this
  # file needs to change.
  - id: qwen3.8-flash
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "qwen3.8-flash"
    context_window: 128000
    max_output: 8192
    modalities: [text]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 4000000
    quirks:
      strip: [logit_bias, seed]

  - id: deepseek-v4-flash
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "deepseek-v4-flash"
    context_window: 128000
    max_output: 8192
    modalities: [text]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 4000000
    quirks:
      strip: [logit_bias, seed]

  - id: dots-3-note-preview
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "dots-3-note-preview"
    context_window: 32000
    max_output: 4096
    modalities: [text]
    supports_tools: false
    supports_json_schema: false
    tpm_limit: 3000000
    quirks:
      strip: [logit_bias, seed, frequency_penalty, presence_penalty]
      no_temperature: true
      no_top_p: true
      max_completion_tokens: true

  - id: glm-5.3
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "glm-5.3"
    context_window: 128000
    max_output: 8192
    modalities: [text, image]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 3000000
    quirks:
      strip: [seed]

  - id: kilo-auto
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "kilo-auto"
    context_window: 64000
    max_output: 4096
    modalities: [text]
    supports_tools: true
    supports_json_schema: false
    tpm_limit: 2000000
    quirks:
      strip: [logit_bias]

  # Not currently referenced by any public_models[] entry above -- see the
  # comment on gpt-router-large's upstream list. If you have a real
  # self-hosted server, point base_url at its actual host:port (NOT the
  # same port as server.listen -- the router can't be its own upstream)
  # and add this id back into each public model's upstreams list; its
  # 200k context window and audio modality make it the only member of the
  # pool that can serve the largest requests / audio inputs at all.
  - id: selfhost-pool
    base_url: "http://localhost:8000/v1"
    api_key_env: ""
    model: "self-hosted-70b"
    context_window: 200000
    max_output: 16384
    modalities: [text, image, audio]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 20000000
    quirks: {}

redis:
  enabled: false
  url: ""
