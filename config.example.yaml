server:
  listen: ":8080"
  max_attempts: 3
  request_budget: 90s
  # Bearer token required to read /internal/stats. Leave unset to disable
  # the endpoint entirely (it refuses all requests rather than defaulting open).
  stats_auth_token: "change-me"

public_models:
  - name: "gpt-router-large"
    upstreams:
      # All five of these route to the same provider, api.kiosapi.com,
      # which together should carry ~60-70% of total token volume. Kept as
      # five separate upstream entries (one per model) rather than one
      # entry, because Stage 1 gating and TPM budgeting are per-model.
      - id: qwen3.8-flash
        weight: 0.14
      - id: deepseek-v4-flash
        weight: 0.14
      - id: dots-3-note-preview
        weight: 0.13
      - id: glm-5.3
        weight: 0.13
      - id: kilo-auto
        weight: 0.11
      - id: selfhost-pool
        weight: 0.35
        fallback: true

upstreams:
  # kiosapi.com-backed models. All share the same base_url and API key —
  # export KIOSAPI_KEY with the key once you have it; nothing else in this
  # file needs to change.
  - id: qwen3.8-flash
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "qwen3.8-flash"
    context_window: 128000
    max_output: 8192
    modalities: [text]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 4000000
    quirks:
      strip: [logit_bias, seed]

  - id: deepseek-v4-flash
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "deepseek-v4-flash"
    context_window: 128000
    max_output: 8192
    modalities: [text]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 4000000
    quirks:
      strip: [logit_bias, seed]

  - id: dots-3-note-preview
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "dots-3-note-preview"
    context_window: 32000
    max_output: 4096
    modalities: [text]
    supports_tools: false
    supports_json_schema: false
    tpm_limit: 3000000
    quirks:
      strip: [logit_bias, seed, frequency_penalty, presence_penalty]
      no_temperature: true
      no_top_p: true
      max_completion_tokens: true

  - id: glm-5.3
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "glm-5.3"
    context_window: 128000
    max_output: 8192
    modalities: [text, image]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 3000000
    quirks:
      strip: [seed]

  - id: kilo-auto
    base_url: "https://api.kiosapi.com/v1"
    api_key_env: "KIOSAPI_KEY"
    model: "kilo-auto"
    context_window: 64000
    max_output: 4096
    modalities: [text]
    supports_tools: true
    supports_json_schema: false
    tpm_limit: 2000000
    quirks:
      strip: [logit_bias]

  # The universal fallback: must satisfy the widest capability set
  # (multimodal, tools, structured output, largest context) since it is
  # the only guaranteed candidate when every other upstream is gated out.
  - id: selfhost-pool
    base_url: "http://localhost:8000/v1"
    api_key_env: ""
    model: "self-hosted-70b"
    context_window: 200000
    max_output: 16384
    modalities: [text, image, audio]
    supports_tools: true
    supports_json_schema: true
    tpm_limit: 20000000
    quirks: {}

redis:
  enabled: false
  url: ""
